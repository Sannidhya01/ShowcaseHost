services:
  postgres:
    image: paradedb/paradedb:0.25.6-pg16
    command: ["postgres", "-c", "shared_preload_libraries=pg_search"]
    environment:
      POSTGRES_DB: showcasehost
      POSTGRES_USER: showcasehost
      POSTGRES_PASSWORD: showcasehost
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showcasehost -d showcasehost"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.10.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  qdrant-data:
