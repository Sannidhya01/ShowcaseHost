[project]
name = "showcasehost-api"
version = "0.1.0"
description = "FastAPI backend for ShowcaseHost."
readme = "../../README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.2",
  "asyncpg>=0.29.0",
  "fastapi>=0.116.0",
  "httpx>=0.27.0",
  "nltk>=3.8.1,<4",
  "pyjwt[crypto]>=2.9.0",
  "pydantic-settings>=2.4.0",
  "python-json-logger>=2.0.7",
  "sqlalchemy[asyncio]>=2.0.32",
  "uvicorn[standard]>=0.30.6"
]

[dependency-groups]
dev = [
  "aiosqlite>=0.20.0",
  "mypy>=1.11.1",
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.5.7"
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", ".uv-cache", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
pythonpath = ["."]
markers = [
  "live_e2e: exercises live external services and is skipped unless RUN_LIVE_E2E=1",
  "pg_search_e2e: exercises a migrated ParadeDB database and is skipped unless RUN_PG_SEARCH_E2E=1"
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_any_generics = false
